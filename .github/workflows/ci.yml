name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  # Versions currently deployed on Midnight Preview, Preprod and Mainnet (ledger 8):
  # https://docs.midnight.network/relnotes/support-matrix
  COMPACT_DEVTOOLS_VERSION: "0.5.3"
  COMPACT_TOOLCHAIN_VERSION: "0.31.1"

jobs:
  compile-and-test:
    name: Compile contract, typecheck, test, demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Compact devtools
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/midnightntwrk/compact/releases/download/compact-v${COMPACT_DEVTOOLS_VERSION}/compact-installer.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Compact toolchain ${{ env.COMPACT_TOOLCHAIN_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          compact --version
          compact update "${COMPACT_TOOLCHAIN_VERSION}"
          echo "compiler: $(compact compile --version)"
          echo "language: $(compact compile --language-version)"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm --version
          npm ci --legacy-peer-deps

      - name: Compile the Compact contract (with ZK keys)
        run: npm run compact --workspace contract

      - name: Show compiler output
        run: |
          cd contract/src/managed/disclosure-ledger
          find . -type f | sort
          echo "--- circuits in contract-info.json"
          node -e 'const i=require("./compiler/contract-info.json"); for (const c of i.circuits ?? []) console.log(c.name, c.pure ? "(pure)" : "(proof)", (c.arguments ?? []).map(a => a.name).join(", "))'

      - name: Typecheck contract package
        run: npm run typecheck --workspace contract

      - name: Build contract package
        run: npm run build --workspace contract

      - name: Run simulator tests
        run: npm run test --workspace contract

      - name: Typecheck CLI
        run: npm run typecheck --workspace cli

      - name: Run CLI demo
        run: npm run demo --workspace cli

      - name: Upload compiler output and test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiled-contract
          path: |
            contract/src/managed/disclosure-ledger
            contract/reports
          if-no-files-found: warn

  # Informational: does the same source also compile with the newest toolchain
  # (0.36.x, language 0.28, ledger 9, not yet deployed on public networks)?
  forward-compat:
    name: Compile with latest Compact toolchain (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install Compact devtools and latest toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/midnightntwrk/compact/releases/download/compact-v${COMPACT_DEVTOOLS_VERSION}/compact-installer.sh" | sh
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.36
          echo "compiler: $(compact compile --version)"
          echo "language: $(compact compile --language-version)"
          compact compile --skip-zk contract/src/disclosure-ledger.compact /tmp/managed-latest
          ls -R /tmp/managed-latest | head -40
